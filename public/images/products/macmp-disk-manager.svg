    <radialGradient id="glow" cx="78%" cy="18%" r="70%"><stop stop-color="#64D2FF" stop-opacity=".48"/><stop offset="1" stop-color="#64D2FF" stop-opacity="0"/></radialGradient>
    <filter id="shadow" x="-30%" y="-30%" width="170%" height="180%"><feDropShadow dx="0" dy="28" stdDeviation="28" flood-color="#000000" flood-opacity=".42"/></filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#168BFF"/><stop offset="1" stop-color="#64D2FF"/></linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#bg)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <g opacity=".08" stroke="#FFFFFF"><path d="M0 120H1600M0 260H1600M0 400H1600M0 540H1600M0 680H1600M0 820H1600M160 0V900M320 0V900M480 0V900M640 0V900M800 0V900M960 0V900M1120 0V900M1280 0V900M1440 0V900"/></g>
