    <text x="98" y="66" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="15" font-weight="550" fill="#94A3B8" fill-opacity="1" text-anchor="start">原生、克制、可控的 macOS 磁盘工作台</text>
  </g>
  <g filter="url(#shadow)"><g transform="translate(204 214)"><rect width="1190" height="598" rx="34" fill="#0D1729" fill-opacity=".94" stroke="#FFFFFF" stroke-opacity=".12"/><rect x="0" y="0" width="250" height="598" rx="34" fill="#111F35"/><text x="36" y="56" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="17" font-weight="800" fill="#FFFFFF" fill-opacity="1" text-anchor="start">MACMP</text><text x="36" y="82" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="11" font-weight="700" fill="#7890AE" fill-opacity="1" text-anchor="start">DISK MANAGER</text><rect x="24" y="126" width="202" height="44" rx="12" fill="#FFFFFF" fill-opacity=".045"/><text x="54" y="154" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="14" font-weight="650" fill="#91A4BC" fill-opacity="1" text-anchor="start">总览</text><rect x="24" y="184" width="202" height="44" rx="12" fill="#0A84FF" fill-opacity=".18"/><text x="54" y="212" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="14" font-weight="650" fill="#FFFFFF" fill-opacity="1" text-anchor="start">磁盘与卷</text><rect x="24" y="242" width="202" height="44" rx="12" fill="#FFFFFF" fill-opacity=".045"/><text x="54" y="270" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="14" font-weight="650" fill="#91A4BC" fill-opacity="1" text-anchor="start">性能测试</text><rect x="24" y="300" width="202" height="44" rx="12" fill="#FFFFFF" fill-opacity=".045"/><text x="54" y="328" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="14" font-weight="650" fill="#91A4BC" fill-opacity="1" text-anchor="start">NTFS 驱动</text><rect x="24" y="358" width="202" height="44" rx="12" fill="#FFFFFF" fill-opacity=".045"/><text x="54" y="386" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="14" font-weight="650" fill="#91A4BC" fill-opacity="1" text-anchor="start">授权中心</text><rect x="24" y="416" width="202" height="44" rx="12" fill="#FFFFFF" fill-opacity=".045"/><text x="54" y="444" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="14" font-weight="650" fill="#91A4BC" fill-opacity="1" text-anchor="start">设置</text><text x="304" y="62" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="28" font-weight="800" fill="#FFFFFF" fill-opacity="1" text-anchor="start">磁盘总览</text><text x="304" y="92" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="14" font-weight="500" fill="#8296AF" fill-opacity="1" text-anchor="start">实时容量、健康状态与文件系统</text><rect x="304" y="132" width="540" height="204" rx="24" fill="#FFFFFF" fill-opacity=".055" stroke="#FFFFFF" stroke-opacity=".08"/><circle cx="438" cy="234" r="62" fill="none" stroke="#FFFFFF" stroke-opacity=".10" stroke-width="20"/><circle cx="438" cy="234" r="62" fill="none" stroke="#0A84FF" stroke-width="20" stroke-dasharray="245 390" stroke-linecap="round" transform="rotate(-90 438 234)"/><text x="438" y="242" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="24" font-weight="800" fill="#FFFFFF" fill-opacity="1" text-anchor="middle">63%</text><text x="548" y="202" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="18" font-weight="750" fill="#FFFFFF" fill-opacity="1" text-anchor="start">Macintosh HD</text><text x="548" y="232" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="13" font-weight="500" fill="#8296AF" fill-opacity="1" text-anchor="start">APFS · 内部 SSD</text><text x="548" y="276" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="17" font-weight="750" fill="#64D2FF" fill-opacity="1" text-anchor="start">628 GB / 1 TB</text><rect x="868" y="132" width="294" height="204" rx="24" fill="#0A84FF" fill-opacity=".13" stroke="#0A84FF" stroke-opacity=".32"/><text x="898" y="176" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="15" font-weight="700" fill="#D9ECFF" fill-opacity="1" text-anchor="start">读写速度</text><text x="898" y="238" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="38" font-weight="850" fill="#FFFFFF" fill-opacity="1" text-anchor="start">1,842</text><text x="1098" y="238" font-family="SFMono-Regular,Menlo,Monaco,monospace" font-size="13" font-weight="700" fill="#64D2FF" fill-opacity="1" text-anchor="start">MB/s</text><path d="M898 286 C950 250 998 302 1044 258 S1100 276 1130 246" fill="none" stroke="#64D2FF" stroke-width="4" stroke-linecap="round"/><rect x="304" y="366" width="858" height="190" rx="24" fill="#FFFFFF" fill-opacity=".045" stroke="#FFFFFF" stroke-opacity=".08"/><text x="334" y="406" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="14" font-weight="700" fill="#A9BBD0" fill-opacity="1" text-anchor="start">已挂载卷</text><rect x="334" y="432" width="242" height="92" rx="18" fill="#FFFFFF" fill-opacity=".055"/><text x="356" y="467" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="start">System</text><text x="356" y="498" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="12" font-weight="500" fill="#7E93AC" fill-opacity="1" text-anchor="start">APFS · 可读写</text><rect x="604" y="432" width="242" height="92" rx="18" fill="#FFFFFF" fill-opacity=".055"/><text x="626" y="467" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="start">摄影师素材</text><text x="626" y="498" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="12" font-weight="500" fill="#7E93AC" fill-opacity="1" text-anchor="start">exFAT · 可读写</text><rect x="874" y="432" width="242" height="92" rx="18" fill="#FFFFFF" fill-opacity=".055"/><text x="896" y="467" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF" fill-opacity="1" text-anchor="start">Backup</text><text x="896" y="498" font-family="-apple-system,BlinkMacSystemFont,PingFang SC,Hiragino Sans GB,Helvetica Neue,sans-serif" font-size="12" font-weight="500" fill="#7E93AC" fill-opacity="1" text-anchor="start">APFS · 可读写</text></g></g>
