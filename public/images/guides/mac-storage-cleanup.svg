<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title">
  <title>Mac 空间清理</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b7285"/>
      <stop offset="1" stop-color="#63e6be"/>
    </linearGradient>
    <radialGradient id="glow" cx="72%" cy="18%" r="70%">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".70"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#001b3d" flood-opacity=".20"/>
    </filter>
  </defs>
  <rect width="1200" height="675" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="675" rx="28" fill="url(#glow)"/>
  <g opacity=".16" fill="none" stroke="#fff" stroke-width="2">
    <circle cx="950" cy="120" r="150"/><circle cx="950" cy="120" r="220"/><circle cx="950" cy="120" r="290"/>
  </g>
  <g opacity=".20" fill="#fff">
    <rect x="82" y="92" width="336" height="22" rx="11"/>
    <rect x="82" y="130" width="248" height="12" rx="6"/>
  </g>
  <g filter="url(#shadow)" transform="translate(82 190)">
    <rect width="580" height="306" rx="22" fill="#fff" fill-opacity=".96"/>
    <rect x="28" y="28" width="86" height="16" rx="8" fill="#0b7285" opacity=".92"/>
    <rect x="28" y="70" width="430" height="22" rx="11" fill="#18212f" opacity=".84"/>
    <rect x="28" y="108" width="360" height="14" rx="7" fill="#8a95a8" opacity=".84"/>
    <rect x="28" y="136" width="400" height="14" rx="7" fill="#8a95a8" opacity=".55"/>
    <rect x="28" y="185" width="128" height="54" rx="14" fill="#0b7285" opacity=".16"/>
    <rect x="172" y="185" width="128" height="54" rx="14" fill="#63e6be" opacity=".30"/>
    <rect x="316" y="185" width="128" height="54" rx="14" fill="#0b7285" opacity=".10"/>
    <rect x="28" y="260" width="238" height="14" rx="7" fill="#8a95a8" opacity=".52"/>
  </g>
  <g transform="translate(740 218)" fill="#fff">
    <text x="0" y="0" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="34" font-weight="600" opacity=".82">05 / MACMP</text>
    <text x="0" y="92" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="68" font-weight="700">Mac 空间清理</text>
    <text x="0" y="152" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="25" opacity=".88">先定位，再判断，后删除</text>
  </g>
  <g transform="translate(740 480)">
    <rect width="250" height="48" rx="24" fill="#fff" fill-opacity=".18" stroke="#fff" stroke-opacity=".44"/>
    <text x="28" y="31" font-family="PingFang SC,Hiragino Sans GB,sans-serif" font-size="17" fill="#fff">MacMP 专题指南</text>
  </g>
</svg>
