<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title">
  <title>Mac 空间告急 · 系统维护</title>
  <defs>
    <linearGradient id="page" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FAFBFD"/>
      <stop offset="1" stop-color="#F1F4F8"/>
    </linearGradient>
    <radialGradient id="halo" cx="84%" cy="8%" r="72%">
      <stop stop-color="#0A84FF" stop-opacity=".15"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="accentWash" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A84FF" stop-opacity=".13"/>
      <stop offset="1" stop-color="#0A84FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="mediaGradient" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A84FF"/>
      <stop offset=".52" stop-color="#7B5CFF"/>
      <stop offset="1" stop-color="#00D2C8"/>
    </linearGradient>
    <filter id="shadow" x="-25%" y="-20%" width="160%" height="170%">
      <feDropShadow dx="0" dy="24" stdDeviation="24" flood-color="#182033" flood-opacity=".16"/>
    </filter>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.2" fill="#172033" fill-opacity=".07"/>
    </pattern>
    <clipPath id="windowClip"><rect x="626" y="76" width="514" height="510" rx="30"/></clipPath>
  </defs>
  <rect width="1200" height="675" rx="32" fill="url(#page)"/>
  <rect width="1200" height="675" rx="32" fill="url(#dots)"/>
  <rect width="1200" height="675" rx="32" fill="url(#halo)"/>
  <path d="M0 596 C228 530 393 632 617 567 C823 507 1017 561 1200 507 V675 H0Z" fill="url(#accentWash)"/>
  <g transform="translate(64 58)">
    <g>
      <circle cx="20" cy="20" r="20" fill="#0A84FF" fill-opacity=".13"/>
      <path d="M20 9 L20 31 M9 20 L31 20" stroke="#0A84FF" stroke-width="2.2" stroke-linecap="round" opacity=".75"/>
    </g>
    <text x="52" y="26" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="13" font-weight="800" fill="#111318" letter-spacing=".2">MACMP</text>
    <text x="119" y="26" font-family="'SFMono-Regular',Menlo,Monaco,monospace" font-size="10" font-weight="700" fill="#9AA3B1" letter-spacing="1.2">EDITORIAL GUIDE</text>
    <rect x="0" y="63" width="92" height="30" rx="15" fill="#0A84FF" fill-opacity=".12"/>
    <text x="46" y="83" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="12" font-weight="750" fill="#0A84FF" text-anchor="middle">系统维护</text>
    <text x="0" y="164" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="48" font-weight="850" fill="#111318" letter-spacing="-1.7">Mac 空间告急</text>
    <text x="2" y="209" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="20" font-weight="550" fill="#596474">先定位，再迁移，最后清理</text>
    <line x1="0" y1="253" x2="486" y2="253" stroke="#DDE2EA" stroke-width="1"/>
    <text x="0" y="289" font-family="'SFMono-Regular',Menlo,Monaco,monospace" font-size="10" font-weight="750" fill="#8C95A3" letter-spacing="1">GUIDE NO. 05</text>
    <text x="0" y="530" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="15" font-weight="650" fill="#354052">把复杂工作流，讲成能执行的步骤。</text>
    <text x="0" y="563" font-family="'SFMono-Regular',Menlo,Monaco,monospace" font-size="10" font-weight="700" fill="#9AA3B1" letter-spacing=".9">DESKTOP · CREATOR · WORKFLOW</text>
  </g>
  <g filter="url(#shadow)">
      <rect x="626" y="76" width="514" height="510" rx="30" fill="#FFFFFF" stroke="#E4E8EF" stroke-width="1.2"/>
      <path d="M626 106 Q626 76 656 76 H1110 Q1140 76 1140 106 V123 H626 Z" fill="#F7F8FA"/>
      <circle cx="657" cy="100" r="5" fill="#FF5F57" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><circle cx="673" cy="100" r="5" fill="#FEBC2E" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><circle cx="689" cy="100" r="5" fill="#28C840" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/>
      <text x="710" y="104" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="12" font-weight="700" fill="#151922">Storage Map</text>
      <text x="1115" y="104" font-family="'SFMono-Regular',Menlo,Monaco,monospace" font-size="9" font-weight="700" fill="#858D9A" text-anchor="end">LOCATE  →  MOVE  →  CLEAN</text>
      <g clip-path="url(#windowClip)">
        <rect x="626" y="123" width="514" height="463" fill="#FFFFFF"/>
        <rect x="626" y="123" width="514" height="463" fill="#0A84FF" fill-opacity=".025"/>
<rect x="646" y="144" width="198" height="270" rx="22" fill="#F5F9FF" fill-opacity="1" stroke="#0A84FF" stroke-opacity="0.22" stroke-width="1"/><text x="666" y="176" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="13" font-weight="750" fill="#111318" fill-opacity="1" text-anchor="start">Macintosh HD</text><text x="666" y="200" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="10" font-weight="600" fill="#8A93A0" fill-opacity="1" text-anchor="start">内部存储 · 92% 已使用</text><circle cx="744" cy="302" r="61" fill="none" fill-opacity="1" stroke="#E6EEF8" stroke-opacity="1" stroke-width="16"/><path d="M744 241 A61 61 0 1 1 690 326" fill="none" stroke="#0A84FF" stroke-width="16" stroke-linecap="butt"/><text x="744" y="299" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="22" font-weight="850" fill="#111318" fill-opacity="1" text-anchor="middle">92%</text><text x="744" y="321" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="10" font-weight="650" fill="#5B6472" fill-opacity="1" text-anchor="middle">使用率</text><rect x="666" y="377" width="158" height="20" rx="10" fill="#EAF1FA" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="666" y="377" width="114" height="20" rx="10" fill="#0A84FF" fill-opacity="0.85" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="876" y="144" width="228" height="124" rx="22" fill="#FFFFFF" fill-opacity="1" stroke="#E7EAF0" stroke-opacity="1" stroke-width="1"/><text x="896" y="174" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="11" font-weight="650" fill="#8A93A0" fill-opacity="1" text-anchor="start">最大占用</text><rect x="896" y="194" width="188" height="12" rx="6" fill="#EFF2F6" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><rect x="896" y="194" width="119" height="12" rx="6" fill="#FF9F0A" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="896" y="240" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="14" font-weight="700" fill="#111318" fill-opacity="1" text-anchor="start">视频素材</text><text x="1084" y="240" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="13" font-weight="800" fill="#0A84FF" fill-opacity="1" text-anchor="end">38.6 GB</text><rect x="876" y="282" width="228" height="132" rx="22" fill="#FFFFFF" fill-opacity="1" stroke="#E7EAF0" stroke-opacity="1" stroke-width="1"/><text x="896" y="314" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="11" font-weight="650" fill="#8A93A0" fill-opacity="1" text-anchor="start">下一步</text><text x="896" y="346" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="17" font-weight="800" fill="#111318" fill-opacity="1" text-anchor="start">迁移大文件</text><text x="896" y="373" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="10" font-weight="550" fill="#5B6472" fill-opacity="1" text-anchor="start">优先移出原始素材、缓存和旧项目</text><rect x="896" y="390" width="92" height="26" rx="13" fill="#0A84FF" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="942" y="407" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="10" font-weight="750" fill="#FFFFFF" fill-opacity="1" text-anchor="middle">开始整理</text><rect x="646" y="438" width="458" height="102" rx="22" fill="#F8FAFC" fill-opacity="1" stroke="#E7EAF0" stroke-opacity="1" stroke-width="1"/><text x="668" y="468" font-family="'SFMono-Regular',Menlo,Monaco,monospace" font-size="9" font-weight="800" fill="#98A1AD" fill-opacity="1" text-anchor="start" letter-spacing="0.7">MOVE PLAN</text><rect x="668" y="486" width="96" height="34" rx="10" fill="#0A84FF" fill-opacity="0.12" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="716" y="508" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="11" font-weight="750" fill="#0A84FF" fill-opacity="1" text-anchor="middle">本机</text><line x1="776" y1="503" x2="847" y2="503" stroke="#AEB8C5" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><path d="M847 497 l10 6 -10 6z" fill="#AEB8C5"/><rect x="870" y="486" width="108" height="34" rx="10" fill="#EAF2FF" fill-opacity="1" stroke="none" stroke-opacity="1" stroke-width="1"/><text x="924" y="508" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="11" font-weight="750" fill="#3B6EA8" fill-opacity="1" text-anchor="middle">2T 外置盘</text><line x1="990" y1="503" x2="1062" y2="503" stroke="#AEB8C5" stroke-width="2" stroke-opacity="1" stroke-linecap="round"/><path d="M1062 497 l10 6 -10 6z" fill="#AEB8C5"/><text x="1090" y="508" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Helvetica Neue',sans-serif" font-size="10" font-weight="700" fill="#7D8794" fill-opacity="1" text-anchor="middle">归档</text></g></g>
</svg>
